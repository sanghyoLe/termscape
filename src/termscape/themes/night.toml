# Actors are drawn in file order within their layer, so the moon goes first.

[[actor]]
name = "moon"
motion = "static"
only = "full"
layer = "back"
x = [0.55, 0.85]
y = 0.02
color = "yellow bold"
art = '''
  _..._
.:::::::.
:::::::::
:::::::::
`:::::::'
  `'-'`
'''

[[actor]]
name = "moon-small"
motion = "static"
only = "strip"
layer = "back"
x = [0.55, 0.85]
color = "yellow bold"
art = "(@)"

[[actor]]
name = "cloud"
only = "full"
layer = "back"
speed = [0.8, 2]
rate = 0.03
max = 4
start = 2
y = [0.05, 0.4]
color = "white dim"
art = '''
    .--.
 .-(    ).
(___.__)__)
'''

[[actor]]
name = "cloud-small"
only = "strip"
layer = "back"
speed = [0.8, 2]
rate = 0.03
max = 2
start = 1
y = [0, 0.5]
color = "white dim"
art = '''
 .--.
(____)
'''

[[actor]]
name = "rocket"
motion = "rise"
