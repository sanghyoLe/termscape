name = "night"
description = "City skyline under a starry sky: meteors, satellites, a UFO, the odd rocket"

[sky]
chars = [" ", ".", "+", "*"]
colors = ["white", "white dim", "white", "yellow bold"]
density = 0.04

# Buildings. Every '.' and '#' inside a tile is a window that the lights
# below switch on and off; '*' on top of an antenna blinks.
[ground]
height = 0.35
gap = [0, 2]
color = "blue"
colors = { "*" = "red bold", "+" = "red dim" }
blink = { "*" = "+" }
lights = { on = "#", off = ".", on_color = "yellow bold", off_color = "blue dim", ratio = 0.35, rate = 3 }

[[ground.tile]]
art = "|. . .|"

