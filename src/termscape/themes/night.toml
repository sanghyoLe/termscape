layer = "back"
speed = 3
accel = 6
rate = 0.02
max = 1
x = [0.05, 0.95]
fps = 8
color = "white bold"
colors = { "(" = "cyan bold", ")" = "cyan bold", "^" = "red bold", "*" = "yellow bold", "'" = "yellow" }
