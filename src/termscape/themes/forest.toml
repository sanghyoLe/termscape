[[actor]]
name = "moon"
motion = "static"
only = "full"
layer = "back"
x = [0.6, 0.9]
y = 0.02
color = "yellow"
art = '''
  _..._
.:::::::.
:::::::::
`:::::::'
  `'-'`
'''

[[actor]]
name = "moon-small"
motion = "static"
only = "strip"
layer = "back"
x = [0.6, 0.9]
color = "yellow"
art = "(@)"

[[actor]]
name = "bird"
speed = [4, 8]
rate = 0.1
max = 3
y = [0, 0.4]
fps = 4
mirror = false
color = "white"
frames = ['\v/', '-v-']

[[actor]]
name = "leaf"
motion = "fall"
speed = [1, 2.5]
sway = 1.5
rate = 1.0
max = 12
start = 5
palette = ["yellow", "red", "bright_red", "yellow bold"]
art = ","

[[actor]]
name = "leaf-curl"
motion = "fall"
speed = [0.8, 2]
sway = 2.0
rate = 0.5
max = 6
start = 2
palette = ["yellow", "red"]
art = "~"

[[actor]]
name = "rabbit"
speed = [1, 3]
rate = 0.03
max = 1
y = 1.0
bob = 0.4
mirror = false
color = "white bold"
art = '''
(\_/)
(o.o)
'''
