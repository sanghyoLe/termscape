name = "forest"
description = "Pine forest at dusk: fireflies, falling leaves, birds and a passing rabbit"

# Fireflies.
[sky]
chars = [" ", " ", ".", "*"]
colors = ["white", "white", "yellow dim", "yellow bold"]
density = 0.02
speed = [0.8, 2.5]

[ground]
height = 0.45
gap = [0, 3]
color = "green"
colors = { "|" = "yellow dim" }
floor = "_"
floor_color = "green dim"

[[ground.tile]]
art = '''
 ^
/^\
'''

[[ground.tile]]
art = '''
